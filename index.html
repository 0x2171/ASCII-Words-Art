<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.0">
    <title>Цветной портрет из букв</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            padding: 20px;
        }
        .container {
            background: #0a0c12;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2a2f45;
            text-align: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 0 0 1px #2a2f45;
            background: #000;
        }
        button {
            background: #2a3f6e;
            border: none;
            color: white;
            font-weight: bold;
            padding: 8px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            font-family: inherit;
        }
        button:hover {
            background: #4a6fa8;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
<div class="container">
    <button id="generateBtn">СОЗДАТЬ ПОРТРЕТ</button>
    <canvas id="artCanvas"></canvas>
</div>

<script>
(function(){
    const IMAGE_URL = 'https://raw.githubusercontent.com/0x2171/Test/refs/heads/main/Photo.jpg';
    const WORDS = ["Аня", "Красота", "Подруга", "ЛП", "Копатель", "Паук", "Касипожка", "Пионер"];
    
    const ALL_LETTERS = WORDS.join('');  // "Анякрасотаподругалпкопательпауккасипожкапионер"
    const LETTERS_COUNT = ALL_LETTERS.length;
    
    const CHARS_HORIZONTAL = 130;        // количество символов по горизонтали (ширина портрета)
    const ASPECT_RATIO_CORRECTION = 1.85;
    
    let canvas = document.getElementById('artCanvas');
    let ctx = canvas.getContext('2d');
    let hiddenCanvas = document.createElement('canvas');
    let hiddenCtx = hiddenCanvas.getContext('2d');
    let isLoading = false;
    
    function loadImage(url) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('загрузка не удалась'));
            img.src = url;
        });
    }
    
    async function renderPortrait() {
        if (isLoading) return;
        isLoading = true;
        
        try {
            const img = await loadImage(IMAGE_URL);
            const origW = img.width;
            const origH = img.height;
            
            let charsVertical = Math.floor((origH / origW) * CHARS_HORIZONTAL * ASPECT_RATIO_CORRECTION);
            charsVertical = Math.min(charsVertical, 100);
            
            hiddenCanvas.width = CHARS_HORIZONTAL;
            hiddenCanvas.height = charsVertical;
            hiddenCtx.drawImage(img, 0, 0, CHARS_HORIZONTAL, charsVertical);
            
            const imageData = hiddenCtx.getImageData(0, 0, CHARS_HORIZONTAL, charsVertical);
            const data = imageData.data;
            
            const fontSize = 16;
            ctx.font = `${fontSize}px 'Courier New', 'Fira Code', monospace`;
            ctx.textBaseline = 'top';
            ctx.textAlign = 'left';
            
            const charWidth = ctx.measureText('W').width;
            const lineHeight = fontSize * 1.2;
            
            canvas.width = CHARS_HORIZONTAL * charWidth;
            canvas.height = charsVertical * lineHeight;
            
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = `${fontSize}px 'Courier New', 'Fira Code', monospace`;
            ctx.textBaseline = 'top';
            
            let letterIndex = 0;
            for (let y = 0; y < charsVertical; y++) {
                for (let x = 0; x < CHARS_HORIZONTAL; x++) {
                    const pixelIdx = (y * CHARS_HORIZONTAL + x) * 4;
                    const r = data[pixelIdx];
                    const g = data[pixelIdx+1];
                    const b = data[pixelIdx+2];
                    
                    const letter = ALL_LETTERS[letterIndex % LETTERS_COUNT];
                    letterIndex++;
                    
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fillText(letter, x * charWidth, y * lineHeight);
                }
            }
        } catch (err) {
            console.error(err);
            ctx.fillStyle = '#ff8888';
            ctx.font = '20px monospace';
            ctx.fillText('Ошибка загрузки изображения', 20, 50);
        } finally {
            isLoading = false;
        }
    }
    
    document.getElementById('generateBtn').addEventListener('click', () => renderPortrait());
    renderPortrait();
})();
</script>
</body>
</html>
